[package]
name = "lichtkasten"
version = "1.2.1"
edition = "2024"
description = "Folder-based photo and video viewer. The folder is the source of truth."
license = "MIT OR Apache-2.0"
authors = ["Dragan Bojovic"]
repository = "https://github.com/Draganito/lichtkasten"
homepage = "https://github.com/Draganito/lichtkasten"
readme = "README.md"
keywords = ["photo", "viewer", "raw", "video", "egui"]
categories = ["multimedia", "gui"]

[package.metadata.deb]
maintainer = "Dragan Bojovic"
section = "graphics"
maintainer-scripts = "packaging/debian"
priority = "optional"
extended-description = """\
Lichtkasten reads the folder you open. No import database. Thumbnails \
live hidden inside the folder you are viewing, so external drives work \
anywhere. Albums are stored in the files' XMP metadata. Videos play \
through GStreamer with the codecs installed on the system. The interface \
follows the system language (English, German)."""
depends = "$auto, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0"
recommends = "gstreamer1.0-plugins-good, gstreamer1.0-plugins-base, gstreamer1.0-libav, gstreamer1.0-plugins-bad, gstreamer1.0-pulseaudio | gstreamer1.0-alsa"
assets = [
    ["target/release/lichtkasten", "usr/bin/", "755"],
    ["packaging/lichtkasten.desktop", "usr/share/applications/", "644"],
    ["packaging/lichtkasten.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/lichtkasten.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/lichtkasten.png", "usr/share/pixmaps/", "644"],
    ["packaging/lichtkasten.metainfo.xml", "usr/share/metainfo/", "644"],
]

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
little_exif = "0.6"
libloading = "0.8"
lru = "0.16"
quick-xml = "0.38"
rawler = "0.8"
resvg = { version = "0.45", default-features = false }
rfd = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
