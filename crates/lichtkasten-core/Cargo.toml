[package]
name = "lichtkasten-core"
version = "0.1.0"
edition = "2024"
description = "Lichtkasten decoding and metadata core, shared by the desktop app and the Android app"
license = "MIT OR Apache-2.0"
authors = ["Dragan Bojovic"]
repository = "https://github.com/Draganito/lichtkasten"
publish = false

[features]
default = ["rawler"]
# Full RAW decoding (demosaic) when a file has no embedded JPEG preview.
# rawler is LGPL-2.1; the desktop app ships it, the Android app does not
# and shows the embedded preview only.
rawler = ["dep:rawler"]
# Lossless JPEG cropping (DCT blocks copied, never re-encoded) through
# libjpeg-turbo's jpegtran code in mozjpeg-sys (IJG/BSD/Zlib). Built from C
# with `cc`, no SIMD, so it cross-compiles wherever the Rust code does.
lossless-jpeg = ["dep:mozjpeg-sys", "dep:libc"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
little_exif = "0.6"
quick-xml = "0.38"
rawler = { version = "0.8", optional = true }
mozjpeg-sys = { version = "2.2", optional = true, default-features = false, features = ["jpegtran", "unwinding", "parallel"] }
libc = { version = "0.2", optional = true }
